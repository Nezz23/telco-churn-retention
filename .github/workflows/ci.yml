name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly retrain + quality gate
jobs:
  train-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python train.py
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model/
      - run: docker build -t telco-churn .
      - name: Smoke-test the container
        run: |
          docker run -d -p 8000:8000 --name api telco-churn
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
